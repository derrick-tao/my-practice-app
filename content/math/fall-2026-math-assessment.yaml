# session and per retry round. The file name must equal the id.
# `within` (5 to 100) and `operations` ([add, subtract]) are optional; they default to 20 and both operations.
# The other math practice types (missing-number, true-or-false, word-problems, strategies) are added here as
# they ship.
id: fall-2026-math-assessment
title: Fall 2026 Math Assessment
subject: math
# TODO: confirm. Assumed to be the same week as the Chinese Fall 2026 Assessment.
testDates: 2026-10-26 to 2026-10-30
facts:
  within: 20
true-or-false:
  within: 20
