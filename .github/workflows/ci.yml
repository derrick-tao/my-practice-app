name: CI

# TEMPORARY debug workflow (do not merge): reproduce the CI-only offline.spec failure and keep traces.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run validate
      - run: npm run typecheck
      - run: npm run test:content
      - run: npm run build
      - name: full Seam 1 exactly like Deploy
        run: nproc; npm run test:e2e
      - name: stress the failing test
        if: always()
        run: npx playwright test tests/e2e/offline.spec.ts --project=iphone-portrait --repeat-each=15 --retries=0 --reporter=list
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 3
