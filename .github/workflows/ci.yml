name: CI

# Pull requests: validate lists, typecheck, run both test seams, and build.
# No secrets, no audio generation, no deploy. (Ticket 02: audio comes from the committed audio/
# folder plus the fake provider; the Azure key must never reach this workflow.)
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install WebKit for Playwright (Seam 1)
        run: npx playwright install --with-deps webkit

      # validate -> typecheck -> test:content (Seam 2) -> build -> test:e2e (Seam 1)
      - run: npm run check
