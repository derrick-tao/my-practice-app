name: CI

# TEMPORARY debug workflow (do not merge): reproduce the CI-only offline.spec failure and keep traces.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: offline.spec repeated, traces on
        env:
          FAKE_AUDIO: '1'
        run: nproc; npx playwright test tests/e2e/offline.spec.ts --repeat-each=3 --trace=on --reporter=list
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 3
