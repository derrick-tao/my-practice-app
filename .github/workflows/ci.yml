name: CI

# Pull requests: validate lessons, typecheck, run both test seams, and build. Seam 1 is sharded across three runners.
# No secrets, no audio generation, no deploy: this workflow does not reference any repository secret, so
# pull-request code can never read the Azure key. Audio comes from the committed audio/ folder; anything a PR
# adds that has no committed audio yet gets silent placeholder audio (FAKE_AUDIO below), which is never
# committed or deployed.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # validate -> typecheck -> Seam 2 -> build. Seam 1 runs in the sharded e2e job below, in parallel.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FAKE_AUDIO: '1' # explicit opt-in to placeholder audio for new items (see content-build/cli.ts)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # A stalled registry request otherwise hangs for npm's 5-minute default.
      - run: npm ci --fetch-timeout=30000 --fetch-retries=5
      - run: npm run validate
      - run: npm run typecheck
      - run: npm run test:content
      - run: npm run build

  # Seam 1, split across three runners. Public repo, so standard runners are free.
  e2e:
    runs-on: ubuntu-latest
    # Playwright's image ships WebKit and its system libraries, so nothing is fetched from the Ubuntu
    # mirror (which sometimes crawls). Keep matrix.playwright in step with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.playwright }}-noble
      env:
        HOME: /root
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        playwright: ['1.64.1'] # image tag; must equal @playwright/test in package-lock
    env:
      FAKE_AUDIO: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # A stalled registry request otherwise hangs for npm's 5-minute default.
      - run: npm ci --fetch-timeout=30000 --fetch-retries=5

      # The image's browser version is fixed by its tag, so it must match the installed Playwright.
      - name: Check the image matches Playwright
        run: |
          want='${{ matrix.playwright }}'
          have="$(npx playwright --version | awk '{print $2}')"
          test "$want" = "$have" || { echo "Image is Playwright $want but package-lock has $have: bump the image tag in both workflows"; exit 1; }

      - name: App tests in WebKit (Seam 1, shard ${{ matrix.shard }}/3)
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - name: Keep the report and traces of a failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7
