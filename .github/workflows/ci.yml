name: CI

# Pull requests: validate lessons, typecheck, run both test seams, and build. Seam 1 is sharded across three runners.
# No secrets, no audio generation, no deploy: this workflow does not reference any repository secret, so
# pull-request code can never read the Azure key. Audio comes from the committed audio/ folder; anything a PR
# adds that has no committed audio yet gets silent placeholder audio (FAKE_AUDIO below), which is never
# committed or deployed.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # validate -> typecheck -> Seam 2 -> build. Seam 1 runs in the sharded e2e job below, in parallel.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FAKE_AUDIO: '1' # explicit opt-in to placeholder audio for new items (see content-build/cli.ts)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # A stalled registry request otherwise hangs for npm's 5-minute default.
      - run: npm ci --fetch-timeout=30000 --fetch-retries=5
      - run: npm run validate
      - run: npm run typecheck
      - run: npm run test:content
      - run: npm run build

  # Seam 1, split across three runners. Public repo, so standard runners are free.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      FAKE_AUDIO: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # A stalled registry request otherwise hangs for npm's 5-minute default.
      - run: npm ci --fetch-timeout=30000 --fetch-retries=5

      - name: Install WebKit for Playwright (Seam 1)
        # The Ubuntu mirror sometimes crawls (apt downloads for ~5 minutes instead of ~10 seconds).
        # Killing a slow attempt orphans its apt-get, which keeps the dpkg lock, so stop it before
        # retrying; downloaded packages stay cached, so the next attempt resumes.
        run: |
          for attempt in 1 2 3 4; do
            timeout -k 5 150 npx playwright install --with-deps webkit && exit 0
            echo "Playwright install attempt $attempt failed or timed out"
            sudo pkill -x apt-get || true
            sleep 3
            sudo dpkg --configure -a || true
          done
          exit 1
        timeout-minutes: 12

      - name: App tests in WebKit (Seam 1, shard ${{ matrix.shard }}/3)
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - name: Keep the report and traces of a failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7
