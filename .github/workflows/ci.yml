name: CI

# TEMPORARY debug workflow (do not merge): reproduce the CI-only offline.spec failure and keep traces.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: full Seam 1 like Deploy (traces retained on failure)
        env:
          FAKE_AUDIO: '1'
        run: nproc; npm run build && npx playwright test --reporter=list
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 3
